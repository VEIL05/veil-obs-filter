<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">VEIL 배경 제거 — 내 배경에 맞춰 고르세요</title>
  <desc id="desc">방 안의 인물에서 배경을 제거해 사람만 남기는 흐름을 그린 기능 안내 일러스트입니다. 일반 배경은 인물 필터, 초록 천은 크로마키를 선택하고 가장자리 필터로 윤곽을 다듬습니다. 실제 보정 전후 영상은 아닙니다.</desc>
