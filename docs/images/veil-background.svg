      <text x="62" y="44" font-size="21" font-weight="700" fill="#141321">VEIL 배경 · 크로마키</text>
    </g>
    <g transform="translate(861 418)">
      <rect width="44" height="44" rx="15" fill="#F6DEE5"/>
      <g fill="none" stroke="#925264" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 33c0-18 7-26 21-22 4 14-4 21-21 22zm0 0 15-15m-8 8 1-8m4 3 8-1"/></g>
      <text x="62" y="16" font-size="15" fill="#625B73">윤곽 부드러움</text>
      <text x="62" y="44" font-size="21" font-weight="700" fill="#141321">VEIL 배경 · 가장자리</text>
    </g>
    <text x="64" y="497" font-size="14" fill="#625B73">인물과 크로마키 중 하나를 켜고, 필요하면 가장자리를 함께 사용하세요.</text>
