    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9E0FA"/><stop offset="1" stop-color="#F8DFE6"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#756491"/><stop offset="1" stop-color="#51445F"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2C9B8"/><stop offset="1" stop-color="#DFAB9B"/></linearGradient>
    <pattern id="checks" width="28" height="28" patternUnits="userSpaceOnUse"><path fill="#F8F5FC" d="M0 0h28v28H0z"/><path fill="#E9E3F1" d="M0 0h14v14H0zm14 14h14v14H14z"/></pattern>
    <clipPath id="portrait-clip"><rect x="596" y="98" width="536" height="428" rx="40"/></clipPath>
