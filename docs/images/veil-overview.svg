<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VEIL — 카메라는 그대로, 분위기는 나답게</title>
  <desc id="desc">얼굴 디테일, 피부, 메이크업, 배경 제거를 소개하는 원본 벡터 일러스트입니다. 실제 OBS 화면이나 보정 전후 사진이 아닙니다.</desc>
  <defs>
